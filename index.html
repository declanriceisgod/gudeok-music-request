<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>구덕고 청소시간 플레이리스트</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600&display=swap');
    :root{--navy:#092149;--blue:#2375ec;--mint:#baffdb;--bg:#fffdf8;--card:#fff;--ink:#1c2a3f;--muted:#728096;--line:#e2e9f3;--hero1:#071b3f;--hero2:#1767c9;--soft:#eafff3;--notice:#205e49}
    body.dark{--bg:#101827;--card:#192437;--ink:#edf4ff;--muted:#a7b4c7;--line:#304157;--soft:#153c37;--notice:#b9f0d5}
    *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);font:400 15px 'Noto Sans KR',Arial,sans-serif;transition:.2s background,color}
    .hero{min-height:400px;padding:28px max(24px,calc((100% - 1080px)/2));position:relative;overflow:hidden;color:#fff;background:linear-gradient(115deg,var(--hero1),#0a3070 57%,var(--hero2))}.hero:after{content:"";position:absolute;width:470px;height:470px;border-radius:50%;right:-128px;top:-246px;border:1px solid #baffdb44;box-shadow:0 0 0 55px #baffdb12,0 0 0 115px #baffdb0c}
    nav,.hero-copy{max-width:1080px;margin:auto;position:relative;z-index:1}nav{display:flex;align-items:center;justify-content:space-between;font-size:14px;font-weight:500}.brand{display:flex;align-items:center;gap:10px}.note{width:29px;height:29px;display:grid;place-items:center;border-radius:9px;background:var(--mint);color:var(--navy);font-size:17px}.nav-right{display:flex;gap:15px;align-items:center;color:var(--mint)}.theme{border:1px solid #ffffff66;background:#ffffff18;color:#fff;border-radius:9px;padding:7px 10px;cursor:pointer;font:inherit;font-size:12px}.hero-copy{padding-top:60px}h1{margin:0;font-size:clamp(34px,5.4vw,61px);line-height:1.2;letter-spacing:-2.7px;font-weight:600}h1 span{color:var(--mint)}.subtitle{margin:16px 0 0;color:#dceaff;line-height:1.65;font-size:15px}
    main{max-width:1080px;margin:-42px auto 0;padding:0 24px 60px;position:relative;z-index:2}.grid{display:grid;grid-template-columns:1fr .95fr;gap:22px;align-items:start}.card{padding:30px;background:var(--card);border:1px solid #174a8b16;border-radius:22px;box-shadow:0 12px 35px #102e5f18}h2{margin:0;font-size:21px;letter-spacing:-.9px;font-weight:600}.lead{margin:8px 0 22px;color:var(--muted);font-size:13px}label{display:block;margin:15px 0 7px;font-size:13px;font-weight:500}input,select{width:100%;padding:13px 14px;border:1px solid #ced8e7;border-radius:11px;outline:0;background:var(--card);color:var(--ink);font:inherit;font-weight:400}body.dark input,body.dark select{border-color:#41536b}input:focus,select:focus{border-color:var(--blue);box-shadow:0 0 0 3px #2375ec22}.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.hint{margin:7px 0 0;color:var(--muted);font-size:11px}.check{display:flex;align-items:center;gap:8px;margin-top:17px;color:var(--muted);font-size:12px}.check input{width:16px;height:16px;accent-color:var(--blue)}button.submit{width:100%;margin-top:22px;border:0;border-radius:12px;padding:15px;cursor:pointer;background:var(--blue);color:white;font:500 15px inherit;transition:.2s}button.submit:hover{transform:translateY(-2px);background:#1466e8}
    .list-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}.count{padding:6px 10px;border-radius:99px;background:#e8f2ff;color:#1763d2;font-weight:500;font-size:12px}.ranking-note{margin:8px 0 16px;color:var(--muted);font-size:12px;line-height:1.55}.song{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}.song:last-child{border:0}.rank{flex:0 0 25px;color:#8795a9;font-size:13px;font-weight:500}.rank.top{color:#e7a515}.album{width:42px;height:42px;border-radius:11px;display:grid;place-items:center;color:#fff;font-size:19px;background:linear-gradient(135deg,#fe7a75,#9c55ff)}.song-info{min-width:0;flex:1}.song-title{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px;font-weight:500}.artist{margin-top:3px;color:var(--muted);font-size:12px}.plays{color:var(--blue);font-size:12px;font-weight:500;white-space:nowrap}.empty{padding:25px 0 7px;color:var(--muted);font-size:12px;text-align:center}.notice{display:flex;gap:12px;align-items:center;margin-top:22px;padding:17px 20px;background:var(--soft);border-radius:18px;color:var(--notice);font-size:12px;line-height:1.65}.notice b{font-weight:600}.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,90px);opacity:0;padding:13px 20px;border-radius:12px;background:#13213a;color:white;box-shadow:0 8px 22px #0003;transition:.35s;z-index:5;font-size:13px}.toast.show{transform:translate(-50%,0);opacity:1}
    @media(max-width:720px){.hero{min-height:410px;padding-top:24px}.hero-copy{padding-top:48px}.hero-copy .subtitle{margin-top:20px}.grid{grid-template-columns:1fr}main{margin-top:-24px}.card{padding:23px}.two{grid-template-columns:1fr;gap:0}.nav-right span{display:none}}
  </style>
</head>
<body>
  <header class="hero"><nav><div class="brand"><span class="note">♪</span> 구덕고등학교 <span style="opacity:.65">|</span> 청소시간 플레이리스트</div><div class="nav-right"><span>매일 · 5교시 후</span><button class="theme" id="themeBtn" type="button">☾ 다크 모드</button></div></nav><div class="hero-copy"><h1>청소는 신나게,<br><span>노래는</span> 너의 선택으로.</h1><p class="subtitle">듣고 싶은 곡을 신청해 주세요.<br>선정된 음악은 다음 청소시간에 재생됩니다!</p></div></header>
  <main><div class="grid"><section class="card"><h2>🎧 노래 신청하기</h2><p class="lead">모두가 즐길 수 있는 곡으로 부탁해요.</p><form id="requestForm"><label for="songTitle">곡 제목</label><input id="songTitle" required placeholder="예: How Sweet"><label for="artist">가수</label><input id="artist" required placeholder="예: NewJeans"><div class="two"><div><label for="studentNo">학번</label><input id="studentNo" required inputmode="numeric" maxlength="4" pattern="[0-9]{4}" placeholder="4자리 숫자"></div><div><label for="studentName">이름</label><input id="studentName" required minlength="2" maxlength="10" pattern="[가-힣]{2,10}" placeholder="실명 입력"></div></div><p class="hint">학번과 이름을 정확히 입력하지 않으면 노래 신청이 접수되지 않습니다.</p><label class="check"><input type="checkbox" required> 욕설·비속어가 없는 곡임을 확인했습니다.</label><button class="submit" type="submit">이 노래 신청하기 →</button></form></section>
  <aside><section class="card"><div class="list-top"><h2>이번 주 가장 많이 신청된 곡</h2><span class="count" id="count">0곡</span></div><p class="ranking-note">많은 사람이 신청할수록 청소시간에 틀게 될 확률이 높아집니다. 랭킹은 매주 월요일에 초기화돼요.</p><div id="songList"><p class="empty">아직 신청한 곡이 없어요!</p></div></section></aside></div></main><div class="toast" id="toast">신청곡이 접수됐어요! 🎉</div>
  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js';
    import { getFirestore, collection, addDoc, serverTimestamp, onSnapshot, query, orderBy } from 'https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js';
    const firebaseConfig={apiKey:'AIzaSyCoHlF3Ty4Cv1hmf7DuMoELxUPq0Ms1ACI',authDomain:'gudoek-music-request.firebaseapp.com',projectId:'gudoek-music-request',storageBucket:'gudoek-music-request.firebasestorage.app',messagingSenderId:'427862837765',appId:'1:427862837765:web:dbcbe57bc5a38b1d41ea6c'};
    const db=getFirestore(initializeApp(firebaseConfig));
    const THEME='gudeok-theme';
    const $=id=>document.getElementById(id),form=$('requestForm'),list=$('songList'),count=$('count'),toast=$('toast'),theme=$('themeBtn');
    function mondayKey(){const korea=new Date(new Date().toLocaleString('en-US',{timeZone:'Asia/Seoul'}));const day=(korea.getDay()+6)%7;korea.setDate(korea.getDate()-day);return `${korea.getFullYear()}-${String(korea.getMonth()+1).padStart(2,'0')}-${String(korea.getDate()).padStart(2,'0')}`}
    const weeklyRequests=collection(db,'weeks',mondayKey(),'requests');
    function render(requests){const groups={};requests.forEach(s=>{const key=(s.title+'|'+s.artist).trim().toLowerCase();if(!groups[key])groups[key]={title:s.title,artist:s.artist,total:0};groups[key].total++});const songs=Object.values(groups).sort((a,b)=>b.total-a.total||a.title.localeCompare(b.title,'ko'));count.textContent=`${songs.length}곡`;list.innerHTML='';if(!songs.length){list.innerHTML='<p class="empty">아직 신청한 곡이 없어요!</p>';return}songs.forEach((s,i)=>{const row=document.createElement('div');row.className='song';row.innerHTML=`<span class="rank ${i<3?'top':''}">${String(i+1).padStart(2,'0')}</span><span class="album">♫</span><div class="song-info"><div class="song-title"></div><div class="artist"></div></div><span class="plays"></span>`;row.querySelector('.song-title').textContent=s.title;row.querySelector('.artist').textContent=s.artist;row.querySelector('.plays').textContent=`${s.total}회 신청`;list.append(row)})}
    onSnapshot(query(weeklyRequests,orderBy('createdAt','desc')),snapshot=>render(snapshot.docs.map(doc=>doc.data())),error=>{console.error(error);list.innerHTML='<p class="empty">신청곡을 불러오지 못했어요. 잠시 후 다시 시도해 주세요.</p>'});
    form.addEventListener('submit',async e=>{e.preventDefault();const no=$('studentNo').value.trim(),name=$('studentName').value.trim();if(!/^\d{4}$/.test(no)||!/^[가-힣]{2,10}$/.test(name)){alert('학번은 4자리 숫자, 이름은 한글 실명으로 정확히 입력해 주세요.');return}const button=form.querySelector('button');button.disabled=true;button.textContent='신청 중…';try{await addDoc(weeklyRequests,{title:$('songTitle').value.trim(),artist:$('artist').value.trim(),createdAt:serverTimestamp()});form.reset();toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),2800)}catch(error){console.error(error);alert('신청을 저장하지 못했어요. 잠시 후 다시 시도해 주세요.')}finally{button.disabled=false;button.textContent='이 노래 신청하기 →'}});
    function setTheme(dark){document.body.classList.toggle('dark',dark);theme.textContent=dark?'☀ 화이트 모드':'☾ 다크 모드';localStorage.setItem(THEME,dark?'dark':'light')}theme.addEventListener('click',()=>setTheme(!document.body.classList.contains('dark')));setTheme(localStorage.getItem(THEME)==='dark');
  </script>
</body></html>
